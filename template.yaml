AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Prode Mundial - Backend

Parameters:
  JwtSecret:
    Type: String
    NoEcho: true
    Description: Secret for signing JWT tokens

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 10
    MemorySize: 128
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        USERS_TABLE_NAME: !Ref UsersTable
        MATCHES_TABLE_NAME: !Ref MatchesTable
        PREDICTIONS_TABLE_NAME: !Ref PredictionsTable
        DAY_EVENTS_TABLE_NAME: !Ref DayEventsTable
        STEALERS_TABLE_NAME: !Ref StealersTable
        BLOCKED_VICTIMS_TABLE_NAME: !Ref BlockedVictimsTable
        STEAL_PICKS_TABLE_NAME: !Ref StealPicksTable
        LINEUP_PICKS_TABLE_NAME: !Ref LineupPicksTable
        JWT_SECRET: !Ref JwtSecret

Resources:
  ProdeHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
      Auth:
        DefaultAuthorizer: JwtAuthorizer
        Authorizers:
          JwtAuthorizer:
            FunctionArn: !GetAtt JwtAuthorizerFunction.Arn
            AuthorizerPayloadFormatVersion: '2.0'
            EnableSimpleResponses: true
            Identity:
              Headers:
                - Authorization

  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: Users
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH

  MatchesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: Matches
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: matchId
          AttributeType: S
      KeySchema:
        - AttributeName: matchId
          KeyType: HASH

  PredictionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: Predictions
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
        - AttributeName: matchId
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH
        - AttributeName: matchId
          KeyType: RANGE

  DayEventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: DayEvents
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: date
          KeyType: HASH

  StealersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: Stealers
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: dayId
          AttributeType: S
        - AttributeName: stealerUsername
          AttributeType: S
      KeySchema:
        - AttributeName: dayId
          KeyType: HASH
        - AttributeName: stealerUsername
          KeyType: RANGE

  BlockedVictimsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: BlockedVictims
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: username
          KeyType: HASH

  StealPicksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: StealPicks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: calendarDate
          AttributeType: S
        - AttributeName: stealerUsername
          AttributeType: S
        - AttributeName: matchId
          AttributeType: S
      KeySchema:
        - AttributeName: calendarDate
          KeyType: HASH
        - AttributeName: stealerUsername
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: matchId-index
          KeySchema:
            - AttributeName: matchId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  LineupPicksTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TableName: LineupPicks
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventDay
          AttributeType: S
        - AttributeName: username
          AttributeType: S
      KeySchema:
        - AttributeName: eventDay
          KeyType: HASH
        - AttributeName: username
          KeyType: RANGE

  JwtAuthorizerFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/jwt-authorizer/handler.handler
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/functions/jwt-authorizer/handler.ts
        Minify: true
        Target: es2020
        Sourcemap: true

  JwtAuthorizerFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt JwtAuthorizerFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ProdeHttpApi}/*/*'

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/login/handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        LoginApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProdeHttpApi
            Path: /auth/login
            Method: POST
            Auth:
              Authorizer: NONE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/functions/login/handler.ts
        Minify: true
        Target: es2020
        Sourcemap: true

  GetCurrentUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/get-current-user/handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        GetCurrentUserApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProdeHttpApi
            Path: /users/me
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/functions/get-current-user/handler.ts
        Minify: true
        Target: es2020
        Sourcemap: true

  UpdateCurrentUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/update-current-user/handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBWritePolicy:
            TableName: !Ref UsersTable
      Events:
        UpdateCurrentUserApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProdeHttpApi
            Path: /users/me
            Method: PATCH
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/functions/update-current-user/handler.ts
        Minify: true
        Target: es2020
        Sourcemap: true

  GetUsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/get-users/handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
      Events:
        GetUsersApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProdeHttpApi
            Path: /users
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/functions/get-users/handler.ts
        Minify: true
        Target: es2020
        Sourcemap: true

  GetMatchesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/get-matches/handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MatchesTable
      Events:
        GetMatchesApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProdeHttpApi
            Path: /matches
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/functions/get-matches/handler.ts
        Minify: true
        Target: es2020
        Sourcemap: true

  GetPredictionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/get-predictions/handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PredictionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref StealPicksTable
        - DynamoDBReadPolicy:
            TableName: !Ref MatchesTable
      Events:
        GetPredictionsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProdeHttpApi
            Path: /predictions
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/functions/get-predictions/handler.ts
        Minify: true
        Target: es2020
        Sourcemap: true

  GetLineupPicksFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/get-lineup-picks/handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref LineupPicksTable
        - DynamoDBReadPolicy:
            TableName: !Ref MatchesTable
      Events:
        GetLineupPicksApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProdeHttpApi
            Path: /lineup-picks
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/functions/get-lineup-picks/handler.ts
        Minify: true
        Target: es2020
        Sourcemap: true

  SaveLineupPickFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/save-lineup-pick/handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MatchesTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBWritePolicy:
            TableName: !Ref LineupPicksTable
      Events:
        SaveLineupPickApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProdeHttpApi
            Path: /lineup-picks
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/functions/save-lineup-pick/handler.ts
        Minify: true
        Target: es2020
        Sourcemap: true

  UpdateLineupPointsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/update-lineup-points/handler.handler
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref LineupPicksTable
      Events:
        UpdateLineupPointsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProdeHttpApi
            Path: /lineup-picks/points
            Method: PATCH
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/functions/update-lineup-points/handler.ts
        Minify: true
        Target: es2020
        Sourcemap: true

  SavePredictionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/save-predictions/handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MatchesTable
        - DynamoDBWritePolicy:
            TableName: !Ref PredictionsTable
      Events:
        SavePredictionsApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProdeHttpApi
            Path: /predictions
            Method: POST
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/functions/save-predictions/handler.ts
        Minify: true
        Target: es2020
        Sourcemap: true

  UploadMatchesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/upload-matches/handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref MatchesTable
        - DynamoDBWritePolicy:
            TableName: !Ref MatchesTable
        - DynamoDBReadPolicy:
            TableName: !Ref PredictionsTable
        - DynamoDBWritePolicy:
            TableName: !Ref PredictionsTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBWritePolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref DayEventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref StealPicksTable
        - DynamoDBWritePolicy:
            TableName: !Ref StealPicksTable
        - DynamoDBReadPolicy:
            TableName: !Ref LineupPicksTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/functions/upload-matches/handler.ts
        Minify: true
        Target: es2020
        Sourcemap: true

  CalculateStealersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/calculate-stealers/handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref StealersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BlockedVictimsTable
        - DynamoDBReadPolicy:
            TableName: !Ref StealPicksTable
        - DynamoDBReadPolicy:
            TableName: !Ref UsersTable
        - DynamoDBReadPolicy:
            TableName: !Ref DayEventsTable
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/functions/calculate-stealers/handler.ts
        Minify: true
        Target: es2020
        Sourcemap: true

  GetEventTypeFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/get-event-type/handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref StealersTable
        - DynamoDBReadPolicy:
            TableName: !Ref BlockedVictimsTable
        - DynamoDBReadPolicy:
            TableName: !Ref DayEventsTable
      Events:
        GetEventTypeApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProdeHttpApi
            Path: /event-type
            Method: GET
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/functions/get-event-type/handler.ts
        Minify: true
        Target: es2020
        Sourcemap: true

  SaveStealPickFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/functions/steal-picks/handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref StealersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BlockedVictimsTable
        - DynamoDBReadPolicy:
            TableName: !Ref DayEventsTable
        - DynamoDBReadPolicy:
            TableName: !Ref MatchesTable
        - DynamoDBCrudPolicy:
            TableName: !Ref StealPicksTable
      Events:
        SaveStealPickApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProdeHttpApi
            Path: /steal-picks
            Method: POST
        DeleteStealPickApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref ProdeHttpApi
            Path: /steal-picks
            Method: DELETE
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        EntryPoints:
          - src/functions/steal-picks/handler.ts
        Minify: true
        Target: es2020
        Sourcemap: true

Outputs:
  UsersTableName:
    Description: DynamoDB Users table name (for seed scripts and Lambdas)
    Value: !Ref UsersTable
    Export:
      Name: !Sub '${AWS::StackName}-UsersTableName'
  MatchesTableName:
    Description: DynamoDB Matches table name (for seed scripts and Lambdas)
    Value: !Ref MatchesTable
    Export:
      Name: !Sub '${AWS::StackName}-MatchesTableName'
  PredictionsTableName:
    Description: DynamoDB Predictions table name (for seed scripts and Lambdas)
    Value: !Ref PredictionsTable
    Export:
      Name: !Sub '${AWS::StackName}-PredictionsTableName'
  DayEventsTableName:
    Description: DynamoDB DayEvents table name (for seed scripts and Lambdas)
    Value: !Ref DayEventsTable
    Export:
      Name: !Sub '${AWS::StackName}-DayEventsTableName'
  StealersTableName:
    Description: DynamoDB Stealers table name (for seed scripts and Lambdas)
    Value: !Ref StealersTable
    Export:
      Name: !Sub '${AWS::StackName}-StealersTableName'
  BlockedVictimsTableName:
    Description: DynamoDB BlockedVictims table name (for seed scripts and Lambdas)
    Value: !Ref BlockedVictimsTable
    Export:
      Name: !Sub '${AWS::StackName}-BlockedVictimsTableName'
  StealPicksTableName:
    Description: DynamoDB StealPicks table name (for seed scripts and Lambdas)
    Value: !Ref StealPicksTable
    Export:
      Name: !Sub '${AWS::StackName}-StealPicksTableName'
  LineupPicksTableName:
    Description: DynamoDB LineupPicks table name (for seed scripts and Lambdas)
    Value: !Ref LineupPicksTable
    Export:
      Name: !Sub '${AWS::StackName}-LineupPicksTableName'
  HttpApiUrl:
    Description: HTTP API base URL
    Value: !Sub 'https://${ProdeHttpApi}.execute-api.${AWS::Region}.amazonaws.com'
